name: CI/CD Pipeline (Portainer)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # Using github.repository gets the format 'owner/repo'
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-checks:
    name: Test, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Backend Restore, Build & Unit/Integration Tests
        working-directory: ./backend
        run: |
          dotnet restore SenicBilling.slnx
          dotnet build SenicBilling.slnx --no-restore
          dotnet test SenicBilling.slnx --no-build --verbosity normal

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend Lint, Build & Unit Tests
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
          npx playwright install chromium --with-deps
          npm run test:e2e

      - name: Admin Frontend Lint, Build, Unit & E2E Tests
        working-directory: ./admin-frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm run test:e2e

  build-and-push:
    name: Build & Push to GHCR
    needs: quality-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

      - name: Build and push Admin Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-frontend
          file: ./admin-frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin-frontend:latest

  deploy:
    name: Deploy to Portainer
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer Webhook
        # Ensure PORTAINER_WEBHOOK_URL is set in GitHub repository secrets
        run: |
          echo "Triggering Portainer Webhook..."
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
