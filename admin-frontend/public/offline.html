<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e293b" />
    <title>Senic Platform Admin — ออฟไลน์ (Offline)</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.25rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.25rem + env(safe-area-inset-left, 0px));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        line-height: 1.6;
      }

      .card {
        width: 100%;
        max-width: 440px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 1.25rem;
        padding: 2rem 1.75rem;
        text-align: center;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
      }

      .badge-icon {
        width: 68px;
        height: 68px;
        margin: 0 auto 1.25rem;
        border-radius: 1.125rem;
        background: linear-gradient(135deg, #1d4ed8 0%, #0284c7 52%, #22d3ee 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
      }

      .status-pill {
        display: inline-block;
        padding: 0.3rem 0.85rem;
        border-radius: 9999px;
        font-size: 0.78rem;
        font-weight: 600;
        background: rgba(56, 189, 248, 0.14);
        color: #38bdf8;
        margin-bottom: 0.9rem;
      }

      h1 {
        margin: 0 0 0.65rem;
        font-size: 1.35rem;
        font-weight: 700;
      }

      p {
        margin: 0 0 1rem;
        font-size: 0.94rem;
        color: #94a3b8;
      }

      button {
        width: 100%;
        min-height: 46px;
        padding: 0.75rem 1.25rem;
        border-radius: 0.85rem;
        border: none;
        background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="badge-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="2" x2="22" y2="22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 12.86a10 10 0 0 1 5.17-2.89" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <div class="status-pill">Admin Offline Mode • ไม่พบอินเทอร์เน็ต</div>
      <h1>ไม่สามารถเชื่อมต่อระบบได้ในขณะนี้</h1>
      <p>
        Senic Platform Admin ต้องการอินเทอร์เน็ตสำหรับตรวจสอบข้อมูลผู้เช่าและการเรียกเก็บเงิน กรุณาตรวจสอบการเชื่อมต่อ
      </p>
      <button type="button" onclick="window.location.reload()">
        ลองเชื่อมต่ออีกครั้ง / Retry Connection
      </button>
    </main>
    <script>
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
