<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <title>Senic Billing Next — ออฟไลน์ (Offline)</title>
    <style>
      :root {
        --bg: #fffbf7;
        --surface: #ffffff;
        --text: #1c1917;
        --muted: #57534e;
        --border: #f5e6d8;
        --primary: #ea580c;
        --primary-hover: #c2410c;
        --shadow: 0 20px 45px rgba(234, 88, 12, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --surface: #1e293b;
          --text: #f8fafc;
          --muted: #94a3b8;
          --border: #334155;
          --primary: #f97316;
          --primary-hover: #ea580c;
          --shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.25rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.25rem + env(safe-area-inset-left, 0px));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      .card {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        padding: 2rem 1.75rem;
        text-align: center;
        box-shadow: var(--shadow);
      }

      .badge-icon {
        width: 68px;
        height: 68px;
        margin: 0 auto 1.25rem;
        border-radius: 1.125rem;
        background: linear-gradient(135deg, #ea580c 0%, #f97316 55%, #fb923c 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow: 0 12px 24px rgba(234, 88, 12, 0.25);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.3rem 0.85rem;
        border-radius: 9999px;
        font-size: 0.78rem;
        font-weight: 600;
        background: rgba(234, 88, 12, 0.12);
        color: var(--primary);
        margin-bottom: 0.9rem;
      }

      h1 {
        margin: 0 0 0.65rem;
        font-size: 1.35rem;
        font-weight: 700;
      }

      p {
        margin: 0 0 1rem;
        font-size: 0.94rem;
        color: var(--muted);
      }

      .en-sub {
        font-size: 0.84rem;
        opacity: 0.9;
        margin-bottom: 1.5rem;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      button {
        width: 100%;
        min-height: 46px;
        padding: 0.75rem 1.25rem;
        border-radius: 0.85rem;
        border: none;
        background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
        color: #ffffff;
        font-size: 0.96rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s ease, transform 0.15s ease;
      }

      button:active {
        transform: scale(0.98);
      }

      .hint {
        margin-top: 1.25rem;
        padding-top: 1rem;
        border-top: 1px dashed var(--border);
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="badge-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="2" x2="22" y2="22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 12.86a10 10 0 0 1 5.17-2.89" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <div class="status-pill">Offline Mode • ไม่พบการเชื่อมต่ออินเทอร์เน็ต</div>
      <h1>ไม่สามารถเชื่อมต่อเครือข่ายได้ในขณะนี้</h1>
      <p>
        กรุณาตรวจสอบ Wi-Fi หรือสัญญาณอินเทอร์เน็ตบนอุปกรณ์ของคุณ ระบบจะโหลดหน้าล่าสุดให้อัตโนมัติเมื่อกลับมาออนไลน์
      </p>
      <p class="en-sub">
        You are currently offline. Please check your connection and try again.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">
          ลองเชื่อมต่ออีกครั้ง / Retry Connection
        </button>
      </div>
      <div class="hint">Senic Billing Next PWA</div>
    </main>
    <script>
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
